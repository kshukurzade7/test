<!doctype html>
<meta charset="utf-8">
<title>SHIRÁ longneck render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/" } }
</script>
<script type="module">
// SHIRÁ product shot with 500 ml longneck juice bottles (tall slim body,
// long gentle shoulder, short ribbed champagne-gold cap) on a wooden surface
// with a softly blurred warm background and photographic depth of field.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1200, H = +q.get('h') || 1500, SS = +q.get('ss') || 1.5; // supersampling
const RW = Math.round(W * SS), RH = Math.round(H * SS);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(RW, RH); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.6;

const canvasTex = (w, h, draw, srgb = true) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
};
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ------------------------------------------------------------ backdrop
// warm interior with soft bokeh highlights (it is thrown out of focus anyway)
const bgTex = canvasTex(2048, 1024, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#6b4a33'); grd.addColorStop(0.45, '#b98c63'); grd.addColorStop(1, '#8a6545');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  const glow = g.createRadialGradient(w * 0.5, h * 0.35, 10, w * 0.5, h * 0.35, w * 0.45);
  glow.addColorStop(0, 'rgba(255,226,180,0.75)'); glow.addColorStop(1, 'rgba(255,226,180,0)');
  g.fillStyle = glow; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const x = rnd() * w, y = rnd() * h * 0.7, r = 10 + rnd() * 45;
    const b = g.createRadialGradient(x, y, 0, x, y, r);
    b.addColorStop(0, `rgba(255,${210 + rnd() * 40 | 0},${150 + rnd() * 60 | 0},${0.15 + rnd() * 0.3})`);
    b.addColorStop(1, 'rgba(255,220,170,0)');
    g.fillStyle = b; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(260, 130), new THREE.MeshBasicMaterial({ map: bgTex, toneMapped: false }));
bg.position.set(0, 40, -110); scene.add(bg);

// ------------------------------------------------------------ wooden table
const woodTex = canvasTex(2048, 2048, (g, w, h) => {
  g.fillStyle = '#5a3519'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 2) {
    const v = Math.sin(y * 0.021) * 0.5 + Math.sin(y * 0.0071 + 1.3) * 0.35 + Math.sin(y * 0.13) * 0.15;
    const l = 0.82 + v * 0.16;
    g.fillStyle = `rgba(${130 * l | 0},${80 * l | 0},${44 * l | 0},0.6)`; g.fillRect(0, y, w, 2);
  }
  for (let i = 0; i < 2600; i++) {
    g.strokeStyle = `rgba(${60 + rnd() * 40 | 0},${35 + rnd() * 25 | 0},${18 + rnd() * 15 | 0},${0.05 + rnd() * 0.12})`;
    g.lineWidth = 0.5 + rnd() * 1.6; const y = rnd() * h, x = rnd() * w, len = 80 + rnd() * 500;
    g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + len * 0.3, y + rnd() * 6 - 3, x + len * 0.6, y + rnd() * 6 - 3, x + len, y + rnd() * 4 - 2); g.stroke();
  }
  for (let i = 0; i < 5; i++) { // a few plank joints
    const y = (i + 0.5) * h / 5; g.fillStyle = 'rgba(30,15,6,0.55)'; g.fillRect(0, y, w, 3);
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.rotation = Math.PI / 2; woodTex.repeat.set(1.2, 1.2);
const table = new THREE.Mesh(new THREE.PlaneGeometry(220, 160),
  new THREE.MeshPhysicalMaterial({ map: woodTex, color: '#9a8270', roughness: 0.45, clearcoat: 0.35, clearcoatRoughness: 0.35 }));
table.rotation.x = -Math.PI / 2; table.position.z = -20; table.receiveShadow = true; scene.add(table);

// ------------------------------------------------------------ bottle
// 500 ml longneck (cm): [radius, height]
const PROFILE = [
  [0.0, 0.0], [2.85, 0.0], [3.18, 0.18], [3.3, 0.6], [3.3, 11.6], [3.24, 12.9], [3.02, 14.8],
  [2.62, 16.9], [2.12, 18.8], [1.7, 20.4], [1.44, 21.8], [1.36, 23.2], [1.34, 24.7],
];
const LIP = [[1.34, 24.7], [1.5, 24.85], [1.52, 25.25], [1.38, 25.4]];
const smoothPts = (pts, n = 220) => new THREE.SplineCurve(pts.map(([r, y]) => new THREE.Vector2(r, y))).getPoints(n);
const insetPts = (pts, d, maxY) => {
  const out = [];
  for (const [r, y] of pts) { if (y > maxY) break; out.push([r === 0 ? 0 : Math.max(0.01, r - d), r === 0 ? y + d * 2.2 : y]); }
  return out;
};

// clear glass: thin reflective shell (additive, so it only adds reflections + fresnel)
const glassShell = new THREE.MeshPhysicalMaterial({
  color: '#000000', roughness: 0.02, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.01,
  specularIntensity: 1, envMapIntensity: 1.3, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
});
// empty glass above the juice: real transmissive glass with a faint green tint
const glassNeck = new THREE.MeshPhysicalMaterial({
  color: '#ffffff', roughness: 0.02, transmission: 1, thickness: 0.25, ior: 1.52,
  attenuationColor: new THREE.Color('#dfeee4'), attenuationDistance: 1.5, envMapIntensity: 1.6, clearcoat: 1,
});
const ribBump = canvasTex(1024, 16, (g, w) => {
  for (let x = 0; x < w; x += 6) {
    const grd = g.createLinearGradient(x, 0, x + 6, 0);
    grd.addColorStop(0, '#333'); grd.addColorStop(0.5, '#fff'); grd.addColorStop(1, '#333');
    g.fillStyle = grd; g.fillRect(x, 0, 6, 16);
  }
}, false);
const capMat = new THREE.MeshPhysicalMaterial({ color: '#E6D2A2', metalness: 1, roughness: 0.22, bumpMap: ribBump, bumpScale: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.2 });
const capTopMat = new THREE.MeshPhysicalMaterial({ color: '#D8C08A', metalness: 1, roughness: 0.24, clearcoat: 0.6 });

const loader = new THREE.TextureLoader();
function bottle({ label, juice, density, cloudy = 0, x, z, rotY = 0, fill = 22.6 }) {
  const g = new THREE.Group();
  // juice: transmissive volume coloured by absorption, like real liquid
  const juiceMat = new THREE.MeshPhysicalMaterial({
    color: '#ffffff', roughness: cloudy ? 0.35 : 0.04, transmission: 1, thickness: 6.2, ior: 1.34,
    attenuationColor: new THREE.Color(juice), attenuationDistance: density, envMapIntensity: 0.6,
  });
  if (cloudy) { juiceMat.transmission = 1 - cloudy; juiceMat.color = new THREE.Color(juice); }
  const juicePts = insetPts(PROFILE, 0.28, fill); juicePts.push([0, fill]);
  const liquid = new THREE.Mesh(new THREE.LatheGeometry(smoothPts(juicePts), 160), juiceMat);
  liquid.castShadow = true; g.add(liquid);
  // meniscus disc
  const rTop = juicePts[juicePts.length - 2][0];
  const surf = new THREE.Mesh(new THREE.CircleGeometry(rTop, 64), juiceMat);
  surf.rotation.x = -Math.PI / 2; surf.position.y = fill; g.add(surf);

  // glass: reflective shell everywhere + transmissive neck above the juice
  const outer = smoothPts(PROFILE.concat(LIP.slice(1)));
  g.add(new THREE.Mesh(new THREE.LatheGeometry(outer, 160), glassShell));
  const neckPts = PROFILE.concat(LIP.slice(1)).filter(([r, y]) => y >= fill - 0.4 && r > 0);
  const neck = new THREE.Mesh(new THREE.LatheGeometry(smoothPts(neckPts, 60), 160), glassNeck);
  g.add(neck);
  // thick glass base
  const base = new THREE.Mesh(new THREE.CylinderGeometry(3.05, 2.85, 0.6, 96), glassNeck);
  base.position.y = 0.3; g.add(base);

  // paper label on the lower body
  const tex = loader.load(label); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 16;
  // print label: 190 x 95 mm trim (+3 mm bleed in the texture), wraps 190 of 207 mm
  tex.repeat.set(190 / 196, 95 / 101); tex.offset.set(3 / 196, 3 / 101);
  const arc = 19.0 / 3.3, h = 9.5; // 190 mm of label around a 33 mm radius
  const lab = new THREE.Mesh(new THREE.CylinderGeometry(3.318, 3.318, h, 200, 1, true, -arc * 0.25, arc),
    new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.62, clearcoat: 0.1, clearcoatRoughness: 0.5 }));
  lab.position.y = 1.7 + h / 2; lab.castShadow = true; g.add(lab);

  // short ribbed champagne-gold cap
  const capH = 1.55;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.62, capH, 160, 1, true), capMat);
  cap.position.y = 25.15 + capH / 2 - 0.35; cap.castShadow = true; g.add(cap);
  const top = new THREE.Mesh(new THREE.SphereGeometry(1.6, 96, 16, 0, Math.PI * 2, 0, 0.32), capTopMat);
  top.scale.y = 0.6; top.position.y = cap.position.y + capH / 2 - 0.55; g.add(top);
  const skirt = new THREE.Mesh(new THREE.TorusGeometry(1.61, 0.07, 12, 160), capTopMat);
  skirt.rotation.x = Math.PI / 2; skirt.position.y = cap.position.y - capH / 2 + 0.05; g.add(skirt);

  g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
}

const SET = q.get('set') || 'trio';
if (SET === 'trio') {
  bottle({ label: 'textures/apricot-wrap.png', juice: '#E2780F', density: 0.55, cloudy: 0.55, x: -7.4, z: 0.6, rotY: 0.1 });
  bottle({ label: 'textures/pomegranate-wrap.png', juice: '#C0102C', density: 2.6, x: 0, z: -0.6, rotY: 0 });
  bottle({ label: 'textures/grape-wrap.png', juice: '#6E1A66', density: 3.2, x: 7.4, z: 0.6, rotY: -0.1 });
  // out-of-focus bottles behind, like a shop shelf
  bottle({ label: 'textures/pomegranate-wrap.png', juice: '#C0102C', density: 2.6, x: -15, z: -30, rotY: 2.6 });
  bottle({ label: 'textures/apricot-wrap.png', juice: '#E2780F', density: 0.55, cloudy: 0.55, x: 16, z: -32, rotY: -2.4 });
}

// ------------------------------------------------------------ lights
const key = new THREE.DirectionalLight('#fff0dc', 3.2);
key.position.set(-28, 40, 26); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 12; key.shadow.blurSamples = 25; key.shadow.bias = -0.0003;
Object.assign(key.shadow.camera, { left: -30, right: 30, top: 35, bottom: -10, near: 1, far: 140 });
scene.add(key);
const back = new THREE.DirectionalLight('#ffd9a8', 2.2); back.position.set(10, 25, -40); scene.add(back); // backlight through the juice
const fill = new THREE.DirectionalLight('#ffe6cc', 0.5); fill.position.set(30, 15, 30); scene.add(fill);
scene.add(new THREE.HemisphereLight('#ffeedd', '#5a3a22', 0.25));

// ------------------------------------------------------------ camera + depth of field
const cam = new THREE.PerspectiveCamera(27, W / H, 0.5, 400);
cam.position.set(0, 16.5, 76); cam.lookAt(0, 12.2, 0);
const composer = new EffectComposer(renderer);
composer.setSize(RW, RH);
composer.addPass(new RenderPass(scene, cam));
const focus = cam.position.distanceTo(new THREE.Vector3(0, 10, 2));
composer.addPass(new BokehPass(scene, cam, { focus, aperture: 0.0016, maxblur: 0.012 }));
composer.addPass(new OutputPass());

function finish() {
  composer.render();
  const c = document.createElement('canvas'); c.id = 'final'; c.width = W; c.height = H;
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.filter = 'contrast(1.06) saturate(1.05)';
  g.drawImage(renderer.domElement, 0, 0, W, H); g.filter = 'none';
  const v = g.createRadialGradient(W / 2, H * 0.48, Math.min(W, H) * 0.4, W / 2, H * 0.48, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(30,15,5,0)'); v.addColorStop(1, 'rgba(30,15,5,0.45)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 6; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
  renderer.domElement.style.display = 'none'; document.body.appendChild(c);
  window.READY = true;
}
let done = false; const go = () => { if (!done) { done = true; finish(); } };
THREE.DefaultLoadingManager.onLoad = go; setTimeout(go, 15000);
</script>

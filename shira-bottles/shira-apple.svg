<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 720" width="340" height="720">
<style>@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Montserrat:wght@500&amp;display=swap");</style>
<defs>
  <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="neckOnly"><rect x="0" y="60" width="220" height="150"/></clipPath>
  <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.15" stop-color="#fff" stop-opacity="0.85"/>
    <stop offset="0.7" stop-color="#fff" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" x2="1">
    <stop offset="0" stop-color="#6a4a12"/>
    <stop offset="0.18" stop-color="#b98a2e"/>
    <stop offset="0.32" stop-color="#f6dd8e"/>
    <stop offset="0.42" stop-color="#d6ad4d"/>
    <stop offset="0.7" stop-color="#a77b25"/>
    <stop offset="0.86" stop-color="#d9b155"/>
    <stop offset="1" stop-color="#5b3f0e"/>
  </linearGradient>
  <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
    <stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="knurl" width="3" height="10" patternUnits="userSpaceOnUse">
    <rect width="1.2" height="10" fill="#3a2706"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7EDE1"/>
    <stop offset="0.72" stop-color="#F1E2D0"/>
    <stop offset="1" stop-color="#E8D5BE"/>
  </linearGradient>
</defs>
<rect width="340" height="720" fill="url(#bg)"/>
<g transform="translate(60 80)">
<defs>
  <clipPath id="inner-apple"><path d="M 93 62 L 93 151 C 93 209 26 236 26 304 L 26 516 Q 26 536 110 539 Q 194 536 194 516 L 194 304 C 194 236 127 209 127 151 L 127 62 Z"/></clipPath>
  <clipPath id="outer-apple"><path d="M 88 62 L 88 150 C 88 205 20 232 20 302 L 20 522 Q 20 548 110 551 Q 200 548 200 522 L 200 302 C 200 232 132 205 132 150 L 132 62 Z"/></clipPath>
  <clipPath id="label-apple"><path d="M 18 312 Q 110 326 202 312 L 202 482 Q 110 496 18 482 Z"/></clipPath>
  <clipPath id="band-apple"><path d="M 18 402 Q 110 416 202 402 L 202 502 L 18 502 Z"/></clipPath>
  <linearGradient id="juiceH-apple" x1="0" x2="1">
    <stop offset="0" stop-color="#9A6110"/>
    <stop offset="0.12" stop-color="#DDA43C"/>
    <stop offset="0.38" stop-color="#F6D07A"/>
    <stop offset="0.55" stop-color="#DDA43C"/>
    <stop offset="0.8" stop-color="#DDA43C"/>
    <stop offset="0.93" stop-color="#9A6110"/>
    <stop offset="1" stop-color="#9A6110"/>
  </linearGradient>
  <linearGradient id="juiceV-apple" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9A6110" stop-opacity="0.55"/>
    <stop offset="0.35" stop-color="#9A6110" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#9A6110" stop-opacity="0"/>
    <stop offset="1" stop-color="#9A6110" stop-opacity="0.5"/>
  </linearGradient>
  <radialGradient id="glow-apple" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#F6D07A" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#F6D07A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="labelShade-apple" x1="0" x2="1">
    <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
    <stop offset="0.18" stop-color="#000" stop-opacity="0.04"/>
    <stop offset="0.36" stop-color="#fff" stop-opacity="0.18"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#000" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
  </linearGradient>
</defs>

<!-- floor shadow and coloured light passing through the juice -->
<ellipse cx="118" cy="551" rx="104" ry="11" fill="#3b2a1a" opacity="0.38" filter="url(#blur6)"/>
<ellipse cx="170" cy="556" rx="80" ry="9" fill="#F6D07A" opacity="0.55" filter="url(#blur8)"/>
<ellipse cx="110" cy="549" rx="80" ry="4" fill="#2a1b10" opacity="0.4" filter="url(#blur2)"/>

<!-- empty glass (air gap in the neck) -->
<path d="M 88 62 L 88 150 C 88 205 20 232 20 302 L 20 522 Q 20 548 110 551 Q 200 548 200 522 L 200 302 C 200 232 132 205 132 150 L 132 62 Z" fill="#ffffff" fill-opacity="0.16"/>

<!-- juice -->
<g clip-path="url(#inner-apple)">
  <rect x="0" y="122" width="220" height="440" fill="url(#juiceH-apple)"/>
  <rect x="0" y="122" width="220" height="440" fill="url(#juiceV-apple)"/>
  <ellipse cx="128" cy="500" rx="58" ry="32" fill="url(#glow-apple)" opacity="0.7"/>
  <rect x="150" y="122" width="18" height="440" fill="#fff" opacity="0.06"/>
  <ellipse cx="110" cy="122" rx="18" ry="2.6" fill="#F6D07A" opacity="0.9"/>
  <ellipse cx="110" cy="123" rx="17" ry="1.6" fill="#fff" opacity="0.25"/>
</g>

<!-- thick glass base -->
<g clip-path="url(#outer-apple)">
  <path d="M 20 516 Q 110 541 200 516 L 200 560 L 20 560 Z" fill="#F6D07A" opacity="0.35"/>
  <path d="M 30 524 Q 110 546 190 524" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.55"/>
  <path d="M 40 534 Q 110 551 180 534" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.35"/>
</g>

<!-- glass walls -->
<path d="M 88 62 L 88 150 C 88 205 20 232 20 302 L 20 522 Q 20 548 110 551 Q 200 548 200 522 L 200 302 C 200 232 132 205 132 150 L 132 62 Z" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6"/>
<path d="M 88 62 L 88 150 C 88 205 20 232 20 302 L 20 522 Q 20 548 110 551 Q 200 548 200 522 L 200 302 C 200 232 132 205 132 150 L 132 62 Z" fill="none" stroke="#2b1a10" stroke-opacity="0.45" stroke-width="1.1"/>
<path d="M 93 62 L 93 151 C 93 209 26 236 26 304 L 26 516 Q 26 536 110 539 Q 194 536 194 516 L 194 304 C 194 236 127 209 127 151 L 127 62 Z" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="0.8" clip-path="url(#neckOnly)"/>

<!-- highlights / reflections -->
<g clip-path="url(#outer-apple)">
  <path d="M 36 300 C 36 262 70 238 92 214" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity="0.55" filter="url(#blur2)"/>
  <rect x="33" y="300" width="9" height="215" rx="4.5" fill="url(#streak)" opacity="0.9"/>
  <rect x="47" y="310" width="3" height="190" rx="1.5" fill="#fff" opacity="0.25"/>
  <rect x="96" y="70" width="5" height="140" rx="2.5" fill="url(#streak)" opacity="0.9"/>
  <rect x="121" y="70" width="2.5" height="130" rx="1.2" fill="#fff" opacity="0.35"/>
  <path d="M 186 300 C 186 262 152 240 132 222" fill="none" stroke="#fff" stroke-width="3" opacity="0.35" filter="url(#blur2)"/>
  <rect x="188" y="300" width="4" height="215" rx="2" fill="#fff" opacity="0.4" filter="url(#blur1)"/>
  <rect x="140" y="250" width="22" height="40" rx="6" fill="#fff" opacity="0.1" transform="skewY(20) translate(0 -55)"/>
</g>

<!-- neck band -->
<path d="M 88 82 L 132 82 L 132 104 L 88 104 Z" fill="#F6EFE3"/>
<path d="M 88 82 L 132 82 L 132 104 L 88 104 Z" fill="url(#labelShade-apple)"/>
<g transform="translate(110 93) scale(0.45)">
<path d="M 0 -5 C 4 -9 11 -7 11 1 C 11 8 6 12 3 12 C 1 12 1 11 0 11 C -1 11 -1 12 -3 12 C -6 12 -11 8 -11 1 C -11 -7 -4 -9 0 -5 Z" fill="#5F8A26"/>
<path d="M 0 -5 Q 0.5 -10 2.5 -12.5" fill="none" stroke="#5F8A26" stroke-width="1.4" stroke-linecap="round"/>
<path d="M 1.5 -8.5 Q 6.5 -14 11 -10.5 Q 6.5 -6.5 1.5 -8.5 Z" fill="#5F8A26"/>
<path d="M -6 -1 Q -7 3 -5 6" fill="none" stroke="#F6EFE3" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/></g>

<!-- glass collar under the cap -->
<rect x="84" y="56" width="52" height="12" rx="4" fill="#fff" opacity="0.22" stroke="#2b1a10" stroke-opacity="0.35" stroke-width="0.8"/>
<rect x="88" y="58" width="6" height="8" rx="2" fill="#fff" opacity="0.55"/>

<!-- gold cap -->
<rect x="81" y="4" width="58" height="56" rx="4" fill="url(#gold)"/>
<rect x="81" y="4" width="58" height="56" rx="4" fill="url(#knurl)" opacity="0.35"/>
<rect x="81" y="4" width="58" height="56" rx="4" fill="url(#goldV)"/>
<rect x="81" y="50" width="58" height="10" rx="3" fill="#5a3d0c" opacity="0.28"/>
<ellipse cx="110" cy="5" rx="28" ry="2.5" fill="#fff3c4" opacity="0.6"/>

<!-- label -->
<g clip-path="url(#outer-apple)">
  <g clip-path="url(#label-apple)">
    <rect x="0" y="302" width="220" height="200" fill="#F6EFE3"/>
    <path d="M 18 402 Q 110 416 202 402 L 202 502 L 18 502 Z" fill="#6E9530"/>
    <g clip-path="url(#band-apple)">
      <g transform="translate(158 452) scale(0.95)" opacity="0.55">
<path d="M 0 -50 Q 4 -66 14 -72" fill="none" stroke="#9A6110" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
<path d="M 8 -60 Q 34 -84 54 -64 Q 30 -48 8 -60 Z" fill="#8DB24E" opacity="0.8"/>
<path d="M 0 -42 C 22 -60 58 -48 58 -4 C 58 36 32 58 16 58 C 6 58 6 54 0 54 C -6 54 -6 58 -16 58 C -32 58 -58 36 -58 -4 C -58 -48 -22 -60 0 -42 Z" fill="#9A6110" opacity="0.45"/>
<path d="M 0 -36 C 18 -52 50 -42 50 -4 C 50 30 28 50 14 50 C 5 50 5 47 0 47 C -5 47 -5 50 -14 50 C -28 50 -50 30 -50 -4 C -50 -42 -18 -52 0 -36 Z" fill="#F4E7B8" opacity="0.55"/>
<g transform="translate(0 2)">
  <circle r="31" fill="none" stroke="#8DB24E" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 3"/>
  <g transform="rotate(-90)"><path d="M 9 0 Q 18 -7 28 0 Q 18 7 9 0 Z" fill="#F6EFE3" opacity="0.35"/><path d="M 16 0 Q 20 -3.5 25 0 Q 20 3.5 16 0 Z" fill="#9A6110" opacity="0.85"/></g><g transform="rotate(-18)"><path d="M 9 0 Q 18 -7 28 0 Q 18 7 9 0 Z" fill="#F6EFE3" opacity="0.35"/><path d="M 16 0 Q 20 -3.5 25 0 Q 20 3.5 16 0 Z" fill="#9A6110" opacity="0.85"/></g><g transform="rotate(54)"><path d="M 9 0 Q 18 -7 28 0 Q 18 7 9 0 Z" fill="#F6EFE3" opacity="0.35"/><path d="M 16 0 Q 20 -3.5 25 0 Q 20 3.5 16 0 Z" fill="#9A6110" opacity="0.85"/></g><g transform="rotate(126)"><path d="M 9 0 Q 18 -7 28 0 Q 18 7 9 0 Z" fill="#F6EFE3" opacity="0.35"/><path d="M 16 0 Q 20 -3.5 25 0 Q 20 3.5 16 0 Z" fill="#9A6110" opacity="0.85"/></g><g transform="rotate(198)"><path d="M 9 0 Q 18 -7 28 0 Q 18 7 9 0 Z" fill="#F6EFE3" opacity="0.35"/><path d="M 16 0 Q 20 -3.5 25 0 Q 20 3.5 16 0 Z" fill="#9A6110" opacity="0.85"/></g>
</g></g>
    </g>
    <g transform="translate(110 334)">
<path d="M 0 -5 C 4 -9 11 -7 11 1 C 11 8 6 12 3 12 C 1 12 1 11 0 11 C -1 11 -1 12 -3 12 C -6 12 -11 8 -11 1 C -11 -7 -4 -9 0 -5 Z" fill="#5F8A26"/>
<path d="M 0 -5 Q 0.5 -10 2.5 -12.5" fill="none" stroke="#5F8A26" stroke-width="1.4" stroke-linecap="round"/>
<path d="M 1.5 -8.5 Q 6.5 -14 11 -10.5 Q 6.5 -6.5 1.5 -8.5 Z" fill="#5F8A26"/>
<path d="M -6 -1 Q -7 3 -5 6" fill="none" stroke="#F6EFE3" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/></g>
    <text x="110" y="370" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="23" letter-spacing="5" fill="#3a2a22">SHIRÁ</text>
    <text x="110" y="390" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-size="16" fill="#5F8A26">Apple</text>
    <text x="110" y="400" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="5" letter-spacing="1.6" fill="#6b5a4e">100% NATURAL JUICE</text>
    <text x="34" y="430" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-size="12" fill="#F6EFE3">Alma</text>
    <text x="34" y="472" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="4.6" letter-spacing="1.2" fill="#F6EFE3" opacity="0.9">PRODUCT OF AZERBAIJAN</text>
    <text x="188" y="472" text-anchor="end" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#F6EFE3">500 ml</text>
    <path d="M 18 312 Q 110 326 202 312 L 202 482 Q 110 496 18 482 Z" fill="url(#labelShade-apple)"/>
  </g>
</g>
</g></svg>

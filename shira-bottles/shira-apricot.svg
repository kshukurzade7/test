<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 740" width="320" height="740">
<style>@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Montserrat:wght@500&amp;display=swap");</style>
<defs>
  <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.15" stop-color="#fff" stop-opacity="0.85"/>
    <stop offset="0.7" stop-color="#fff" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" x2="1">
    <stop offset="0" stop-color="#8d877c"/>
    <stop offset="0.2" stop-color="#cfc9bd"/>
    <stop offset="0.34" stop-color="#fbf8f0"/>
    <stop offset="0.48" stop-color="#ddd7ca"/>
    <stop offset="0.75" stop-color="#b9b2a4"/>
    <stop offset="0.88" stop-color="#e2ddd1"/>
    <stop offset="1" stop-color="#7c766b"/>
  </linearGradient>
  <linearGradient id="capV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
    <stop offset="0.15" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
  </linearGradient>
  <pattern id="knurl" width="2.4" height="10" patternUnits="userSpaceOnUse">
    <rect width="0.9" height="10" fill="#3a352c"/>
  </pattern>
  <linearGradient id="labelShade" x1="0" x2="1">
    <stop offset="0" stop-color="#000" stop-opacity="0.3"/>
    <stop offset="0.2" stop-color="#000" stop-opacity="0.04"/>
    <stop offset="0.36" stop-color="#fff" stop-opacity="0.18"/>
    <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#000" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.38"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7EDE1"/>
    <stop offset="0.72" stop-color="#F1E2D0"/>
    <stop offset="1" stop-color="#E8D5BE"/>
  </linearGradient>
  
<radialGradient id="g-leaf" cx="0.35" cy="0.35" r="0.8"><stop offset="0" stop-color="#8DBE4A"/><stop offset="1" stop-color="#5E8C2F"/></radialGradient>
<radialGradient id="g-apricot" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFC562"/><stop offset="0.55" stop-color="#F28A1E"/><stop offset="1" stop-color="#C9431A"/></radialGradient>
<radialGradient id="g-apricot-flesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFC060"/><stop offset="1" stop-color="#F7A13A"/></radialGradient>
<radialGradient id="g-stone" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#C77A3A"/><stop offset="1" stop-color="#7A3E14"/></radialGradient>
<radialGradient id="g-pom" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#E84A55"/><stop offset="0.6" stop-color="#B3162C"/><stop offset="1" stop-color="#6E0A18"/></radialGradient>
<radialGradient id="g-aril" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#FF5A6E"/><stop offset="1" stop-color="#A50E2A"/></radialGradient>
<radialGradient id="g-grape" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#8E4A8A"/><stop offset="0.6" stop-color="#4E1C4A"/><stop offset="1" stop-color="#2A0A28"/></radialGradient>
<radialGradient id="g-apple" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#F3594A"/><stop offset="0.6" stop-color="#C41E2A"/><stop offset="1" stop-color="#7E0E18"/></radialGradient>

</defs>
<rect width="320" height="740" fill="url(#bg)"/>
<g transform="translate(50 50)">
<defs>
  <clipPath id="inner-apricot"><path d="M 98 66 L 98 130 C 98 209 46 266 46 340 L 46 592 Q 46 609 110 611 Q 174 609 174 592 L 174 340 C 174 266 122 209 122 130 L 122 66 Z"/></clipPath>
  <clipPath id="outer-apricot"><path d="M 93 66 L 93 128 C 93 205 40 262 40 338 L 40 598 Q 40 620 110 622 Q 180 620 180 598 L 180 338 C 180 262 127 205 127 128 L 127 66 Z"/></clipPath>
  <clipPath id="label-apricot"><path d="M 38 400 Q 110.0 412 182 400 L 182 572 Q 110.0 584 38 572 Z"/></clipPath>
  <linearGradient id="juiceH-apricot" x1="0" x2="1">
    <stop offset="0" stop-color="#A3470A"/>
    <stop offset="0.12" stop-color="#EC7E14"/>
    <stop offset="0.36" stop-color="#FFB24F"/>
    <stop offset="0.55" stop-color="#EC7E14"/>
    <stop offset="0.8" stop-color="#EC7E14"/>
    <stop offset="0.94" stop-color="#A3470A"/>
    <stop offset="1" stop-color="#A3470A"/>
  </linearGradient>
  <linearGradient id="juiceV-apricot" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A3470A" stop-opacity="0.5"/>
    <stop offset="0.3" stop-color="#A3470A" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#A3470A" stop-opacity="0"/>
    <stop offset="1" stop-color="#A3470A" stop-opacity="0.5"/>
  </linearGradient>
  <radialGradient id="glow-apricot" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFB24F" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#FFB24F" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- floor shadow and coloured light passing through the juice -->
<ellipse cx="116" cy="622" rx="84" ry="10" fill="#3b2a1a" opacity="0.38" filter="url(#blur6)"/>
<ellipse cx="160" cy="628" rx="70" ry="8" fill="#FFB24F" opacity="0.55" filter="url(#blur8)"/>
<ellipse cx="110" cy="620" rx="64" ry="3.5" fill="#2a1b10" opacity="0.45" filter="url(#blur2)"/>

<!-- empty glass at the top of the neck -->
<path d="M 93 66 L 93 128 C 93 205 40 262 40 338 L 40 598 Q 40 620 110 622 Q 180 620 180 598 L 180 338 C 180 262 127 205 127 128 L 127 66 Z" fill="#ffffff" fill-opacity="0.18"/>

<!-- juice -->
<g clip-path="url(#inner-apricot)">
  <rect x="0" y="104" width="220" height="540" fill="url(#juiceH-apricot)"/>
  <rect x="0" y="104" width="220" height="540" fill="url(#juiceV-apricot)"/>
  <ellipse cx="124" cy="585" rx="48" ry="30" fill="url(#glow-apricot)" opacity="0.7"/>
  <rect x="140" y="104" width="14" height="540" fill="#fff" opacity="0.06"/>
  <ellipse cx="110" cy="104" rx="12" ry="1.8" fill="#FFB24F" opacity="0.9"/>
</g>

<!-- thick glass base -->
<g clip-path="url(#outer-apricot)">
  <path d="M 40 592 Q 110 613 180 592 L 180 640 L 40 640 Z" fill="#FFB24F" opacity="0.35"/>
  <path d="M 48 600 Q 110 618 172 600" fill="none" stroke="#fff" stroke-width="1.4" opacity="0.55"/>
  <path d="M 56 609 Q 110 622 164 609" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.35"/>
</g>

<!-- glass walls -->
<path d="M 93 66 L 93 128 C 93 205 40 262 40 338 L 40 598 Q 40 620 110 622 Q 180 620 180 598 L 180 338 C 180 262 127 205 127 128 L 127 66 Z" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5"/>
<path d="M 93 66 L 93 128 C 93 205 40 262 40 338 L 40 598 Q 40 620 110 622 Q 180 620 180 598 L 180 338 C 180 262 127 205 127 128 L 127 66 Z" fill="none" stroke="#2b1a10" stroke-opacity="0.45" stroke-width="1"/>

<!-- highlights / reflections -->
<g clip-path="url(#outer-apricot)">
  <path d="M 52 336 C 54 286 82 248 99 205" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.5" filter="url(#blur2)"/>
  <rect x="50" y="336" width="8" height="255" rx="4" fill="url(#streak)" opacity="0.9"/>
  <rect x="63" y="344" width="2.5" height="230" rx="1.2" fill="#fff" opacity="0.22"/>
  <rect x="101" y="72" width="4" height="130" rx="2" fill="url(#streak)" opacity="0.9"/>
  <rect x="117" y="72" width="2" height="120" rx="1" fill="#fff" opacity="0.35"/>
  <path d="M 168 336 C 166 290 140 254 124 214" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.35" filter="url(#blur2)"/>
  <rect x="169" y="336" width="3.5" height="255" rx="1.7" fill="#fff" opacity="0.4" filter="url(#blur1)"/>
</g>

<!-- glass lip under the cap -->
<rect x="90" y="60" width="40" height="11" rx="4" fill="#fff" opacity="0.25" stroke="#2b1a10" stroke-opacity="0.35" stroke-width="0.8"/>
<rect x="93" y="62" width="5" height="7" rx="2" fill="#fff" opacity="0.55"/>

<!-- silver twist-off cap -->
<rect x="89" y="28" width="42" height="36" rx="3" fill="url(#silver)"/>
<rect x="89" y="28" width="42" height="36" rx="3" fill="url(#knurl)" opacity="0.22"/>
<rect x="89" y="28" width="42" height="36" rx="3" fill="url(#capV)"/>
<rect x="89" y="56" width="42" height="8" rx="2" fill="#000" opacity="0.12"/>
<line x1="89" y1="56" x2="131" y2="56" stroke="#fff" stroke-opacity="0.5" stroke-width="0.6"/>
<ellipse cx="110" cy="29" rx="20" ry="2" fill="#fff" opacity="0.7"/>

<!-- label -->
<g clip-path="url(#outer-apricot)">
  <g clip-path="url(#label-apricot)">
    <rect x="0" y="390" width="220" height="200" fill="#F7F1E6"/>
    <path d="M 38 520 Q 110.0 532 182 520 L 182 602 Q 110.0 614 38 602 Z" fill="#E27A1E"/>
    <g transform="translate(110 420)"><circle r="10" fill="#E0701A"/><line x1="0" y1="0" x2="7.21" y2="2.98" stroke="#F7F1E6" stroke-width="0.90"/><line x1="0" y1="0" x2="2.98" y2="7.21" stroke="#F7F1E6" stroke-width="0.90"/><line x1="0" y1="0" x2="-2.98" y2="7.21" stroke="#F7F1E6" stroke-width="0.90"/><line x1="0" y1="0" x2="-7.21" y2="2.98" stroke="#F7F1E6" stroke-width="0.90"/><line x1="0" y1="0" x2="-7.21" y2="-2.98" stroke="#F7F1E6" stroke-width="0.90"/><line x1="0" y1="0" x2="-2.98" y2="-7.21" stroke="#F7F1E6" stroke-width="0.90"/><line x1="0" y1="0" x2="2.98" y2="-7.21" stroke="#F7F1E6" stroke-width="0.90"/><line x1="0" y1="0" x2="7.21" y2="-2.98" stroke="#F7F1E6" stroke-width="0.90"/><circle r="3.00" fill="#E0701A"/><polygon points="0.00,-4.20 0.77,-1.85 2.97,-2.97 1.85,-0.77 4.20,0.00 1.85,0.77 2.97,2.97 0.77,1.85 0.00,4.20 -0.77,1.85 -2.97,2.97 -1.85,0.77 -4.20,0.00 -1.85,-0.77 -2.97,-2.97 -0.77,-1.85" fill="#F7F1E6"/><circle r="0.90" fill="#E0701A"/></g>
    <text x="110" y="451" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="21" letter-spacing="4.5" fill="#3a2a22">SHIRÁ</text>
    <text x="110" y="470" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-size="14.5" fill="#E0701A">Apricot</text>
    <text x="110" y="480" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="4.4" letter-spacing="1.4" fill="#6b5a4e">100% NATURAL JUICE</text>
    <g transform="translate(138 524) scale(0.8)">
<g transform="translate(-6 -26) rotate(-150) scale(0.9)"><path d="M 0 0 Q 12 -11 28 0 Q 12 11 0 0 Z" fill="url(#g-leaf)"/><path d="M 1 0 Q 14 -1 26 0" stroke="#3E6A1C" stroke-width="0.8" fill="none"/></g><g transform="translate(4 -27) rotate(-30) scale(1.0)"><path d="M 0 0 Q 12 -11 28 0 Q 12 11 0 0 Z" fill="url(#g-leaf)"/><path d="M 1 0 Q 14 -1 26 0" stroke="#3E6A1C" stroke-width="0.8" fill="none"/></g>
<path d="M 0 -24 Q 1 -30 3 -33" stroke="#6b4a1e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<circle cx="-12" cy="-2" r="22" fill="url(#g-apricot)"/>
<path d="M -14 -23 C -22 -8 -20 8 -12 20" fill="none" stroke="#c4560f" stroke-width="1" opacity="0.6"/>
<ellipse cx="-20" cy="-10" rx="6" ry="4" fill="#fff" opacity="0.25" transform="rotate(-30 -20 -10)"/>
<g transform="translate(18 10)">
  <circle r="19" fill="#E9821F"/>
  <circle r="16.5" fill="url(#g-apricot-flesh)"/>
  <ellipse rx="6.5" ry="10" fill="url(#g-stone)" transform="rotate(-15)"/>
  <g transform="rotate(-15)"><path d="M -3.0 -8 Q -4.5 0 -3.0 8" fill="none" stroke="#6b3410" stroke-width="0.5" opacity="0.6"/><path d="M -1.4 -8 Q -2.9 0 -1.4 8" fill="none" stroke="#6b3410" stroke-width="0.5" opacity="0.6"/><path d="M 0.20000000000000018 -8 Q -1.2999999999999998 0 0.20000000000000018 8" fill="none" stroke="#6b3410" stroke-width="0.5" opacity="0.6"/><path d="M 1.8000000000000007 -8 Q 0.3000000000000007 0 1.8000000000000007 8" fill="none" stroke="#6b3410" stroke-width="0.5" opacity="0.6"/><path d="M 3.4000000000000004 -8 Q 1.9000000000000004 0 3.4000000000000004 8" fill="none" stroke="#6b3410" stroke-width="0.5" opacity="0.6"/></g>
</g></g>
    <text x="52" y="540" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-size="12" fill="#F7F1E6">Ərik</text>
    <text x="52" y="551" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="5" fill="#F7F1E6" opacity="0.9">500 ml</text>
    <text x="52" y="563" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="3.8" letter-spacing="1" fill="#F7F1E6" opacity="0.85">PRODUCT OF AZERBAIJAN</text>
    <path d="M 38 400 Q 110.0 412 182 400 L 182 572 Q 110.0 584 38 572 Z" fill="url(#labelShade)"/>
  </g>
</g>
</g></svg>

    <g clip-path="url(#band-grape)">
      <g transform="translate(158 452) scale(0.95)" opacity="0.55">
<path d="M -4 -48 C -60 -70 -86 -52 -78 -24 C -70 -32 -60 -34 -52 -28 C -58 -46 -38 -56 -26 -50 C -24 -60 -12 -60 -4 -48 Z" fill="#73386B" opacity="0.6"/>

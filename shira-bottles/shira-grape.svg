ty="0.3"/><circle cx="-20.1" cy="21" r="11" fill="#73386B" stroke="#1F0619" stroke-width="1.5"/><ellipse cx="-23.6" cy="17" rx="3" ry="2" fill="#fff" opacity="0.3"/><circle cx="0.8" cy="21" r="11" fill="#73386B" stroke="#1F0619" stroke-width="1.5"/><ellipse cx="-2.7" cy="17" rx="3" ry="2" fill="#fff" opacity="0.3"/><circle cx="18.5" cy="21" r="11" fill="#73386B" stroke="#1F0619" stroke-width="1.5"/><ellipse cx="15.0" cy="17" rx="3" ry="2" fill="#fff" opacity="0.3"/><circle cx="-11.0" cy="40" r="11" fill="#73386B" stroke="#1F0619" stroke-width="1.5"/><ellipse cx="-14.5" cy="36" rx="3" ry="2" fill="#fff" opacity="0.3"/><circle cx="9.0" cy="40" r="11" fill="#73386B" stroke="#1F0619" stroke-width="1.5"/><ellipse cx="5.5" cy="36" rx="3" ry="2" fill="#fff" opacity="0.3"/><circle cx="0.4" cy="58" r="11" fill="#73386B" stroke="#1F0619" stroke-width="1.5"/><ellipse cx="-3.1" cy="54" rx="3" ry="2" fill="#fff" opacity="0.3"/></g>
    </g>
    <g transform="translate(110 334)">
<path d="M 0 -6 Q 0 -10 2 -13" fill="none" stroke="#5B2453" stroke-width="1.4" stroke-linecap="round"/>
<path d="M 1 -10 Q 7 -15 12 -10 Q 7 -6 1 -10 Z" fill="#5B2453"/>
<circle cx="-6" cy="-3" r="3.2" fill="#5B2453"/><circle cx="0" cy="-3" r="3.2" fill="#5B2453"/><circle cx="6" cy="-3" r="3.2" fill="#5B2453"/><circle cx="-3" cy="2.5" r="3.2" fill="#5B2453"/><circle cx="3" cy="2.5" r="3.2" fill="#5B2453"/><circle cx="0" cy="8" r="3.2" fill="#5B2453"/></g>
    <text x="110" y="370" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="23" letter-spacing="5" fill="#3a2a22">SHIRÁ</text>
    <text x="110" y="390" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-size="16" fill="#5B2453">Grape</text>
    <text x="110" y="400" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="5" letter-spacing="1.6" fill="#6b5a4e">100% NATURAL JUICE</text>
    <text x="34" y="430" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-size="12" fill="#F6EFE3">Üzüm</text>
